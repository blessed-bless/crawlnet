[project]
name = "crawlnet"
version = "0.1.0"
description = "Распределённый краулер: очередь в Redis, YAML-спайдеры, дашборд и Telegram-бот"
requires-python = ">=3.12"
authors = [{ name = "Богдан Щербинин" }]
dependencies = [
    "httpx>=0.27",
    "redis>=5",
    "parsel>=1.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "typer>=0.12",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiogram>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "respx>=0.21",
    "ruff>=0.7.0",
]

[project.scripts]
crawlnet = "crawlnet.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawlnet*"]

[tool.setuptools.package-data]
crawlnet = ["dashboard/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
